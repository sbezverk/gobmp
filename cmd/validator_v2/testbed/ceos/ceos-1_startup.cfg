! ceos-1: BMP speaker (AS 64496) receiving routes from two bgpinjector
! containers: 10.1.1.20 over eBGP (AS 64497) and 10.1.1.21 over iBGP.
!
! The data address is on Management0 because the container has a single
! network, and eth0 maps to Management0.
!
hostname ceos-1
!
interface Management0
   ip address 10.1.1.3/24
   ipv6 enable
   ipv6 address 2001:db8:10:1::3/64
   no shutdown
!
ip routing
ipv6 unicast-routing
!
! Routes rejected on input, visible in pre-policy monitoring only.
ip prefix-list BMP-REJECT seq 10 permit 192.0.2.64/26 le 32
!
ipv6 prefix-list BMP-REJECT-V6
   seq 10 permit 2001:db8:bad::/48 le 128
!
route-map BMP-IN deny 10
   match ip address prefix-list BMP-REJECT
!
route-map BMP-IN deny 15
   match ipv6 address prefix-list BMP-REJECT-V6
!
route-map BMP-IN permit 20
!
router bgp 64496
   router-id 192.0.2.1
   bgp log-neighbor-changes
   bgp monitoring
   neighbor 10.1.1.20 remote-as 64497
   neighbor 10.1.1.20 route-map BMP-IN in
   neighbor 10.1.1.20 send-community standard extended large
   ! Adj-RIB-Out is monitored for this neighbor and IPv4 unicast only. The
   ! cEOS 4.35.2F Bmp agent asserted when IPv6 advertised routes were added.
   neighbor 10.1.1.20 monitoring
   neighbor 10.1.1.20 selective monitoring advertised routes
   neighbor 10.1.1.21 remote-as 64496
   !
   address-family ipv4
      neighbor 10.1.1.20 activate
      neighbor 10.1.1.21 activate
      aggregate-address 203.0.113.64/26
   !
   address-family ipv6
      neighbor 10.1.1.20 activate
      neighbor 10.1.1.21 activate
   !
   address-family vpn-ipv4
      neighbor 10.1.1.20 activate
   !
   address-family vpn-ipv6
      neighbor 10.1.1.20 activate
   !
   monitoring received routes address-family ipv4 unicast
   monitoring received routes address-family ipv6 unicast
   monitoring received routes address-family vpn-ipv4
   monitoring received routes address-family vpn-ipv6
   monitoring advertised routes address-family ipv4 unicast
   monitoring statistics interval 15 seconds
   !
   monitoring station gobmp
      statistics
      connection address 10.1.1.2
      connection mode active port 5000
      export-policy received routes pre-policy post-policy
      export-policy advertised routes
      export-policy bgp rib bestpaths
      no shutdown
!
end
